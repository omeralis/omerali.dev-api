
name: Deploy Strapi API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: strapi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu

            cd /var/www/omerali.dev/api

            echo "Pulling latest changes..."
            git pull --ff-only origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building Strapi..."
            NODE_ENV=production NODE_OPTIONS="--max-old-space-size=2048" npm run build

            echo "Restarting Strapi..."
            pm2 restart omerali-api --update-env

            echo "Checking application health..."
            sleep 5

            for i in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error \
                --output /dev/null \
                http://127.0.0.1:1337/admin; then
                echo "Strapi health check passed."
                pm2 save
                echo "Deployment completed successfully."
                exit 0
              fi

              echo "Waiting for Strapi... attempt $i"
              sleep 5
            done

            echo "Health check failed."
            pm2 logs omerali-api --lines 30 --nostream
            exit 1
