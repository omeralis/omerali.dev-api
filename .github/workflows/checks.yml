name: Backend checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:projects
      - run: npm run test:portfolio
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          STRAPI_TELEMETRY_DISABLED: 'true'
